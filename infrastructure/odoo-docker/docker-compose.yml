services:
  odoo-db:
    image: postgres:15-alpine
    container_name: fintax-odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_local
    ports:
      - "5433:5432"
    volumes:
      - odoo-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:16.0
    container_name: fintax-odoo
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    command: ["odoo", "-d", "fintax_clean", "--db-filter=^fintax_clean$", "--no-database-list", "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons"]
    ports:
      - "8069:8069"
      - "8070:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo_local
    volumes:
      - ./extra-addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo

volumes:
  odoo-postgres-data:
  odoo-web-data:
