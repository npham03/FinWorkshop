version: '3.8'

services:
  db:
    image: postgres:15
    container_name: finworkshop-postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - finworkshop-net

  web:
    image: odoo:16.0
    container_name: finworkshop-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./extra-addons:/mnt/extra-addons
    restart: unless-stopped
    networks:
      - finworkshop-net

  mongodb:
    image: mongo:7.0
    container_name: finworkshop-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - finworkshop-net

volumes:
  odoo-db-data:
  odoo-web-data:
  mongo-data:

networks:
  finworkshop-net:
    driver: bridge
